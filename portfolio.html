<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Cids' Park</title>
    <link rel="stylesheet" href="styles/components.css">
    <link rel="stylesheet" href="styles/portfolio.css">
    <!-- Favicon 配置 -->
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="apple-touch-icon" href="assets/favicon.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <meta name="msapplication-TileImage" content="assets/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
</head>
<body class="portfolio-page">

    <header>
        <nav id="navbar" class="top-navbar">
            <div class="nav-links">
                <a href="index.html" class="nav-item">Prologue</a>
                <a href="portfolio.html" class="nav-item active">Mass. Whims</a>
                <a href="about.html" class="nav-item">About</a>
                <a href="mailto:hocids@tongji.edu.cn" class="nav-item">Contact</a>
            </div>
        </nav>
    </header>

    <!-- 作品集内容 -->
    <section class="portfolio-banner">
        <div class="banner-content">
            <h1>
                <br>
                <span class="char">M</span>
                <span class="char">a</span>
                <span class="char">s</span>
                <span class="char">s</span>
                <span class="char">.</span>
                <span class="char">&nbsp;</span>
                <span class="char">W</span>
                <span class="char">h</span>
                <span class="char">i</span>
                <span class="char">m</span>
                <span class="char">s</span>
                <br>
            </h1>

            <!-- 搜索框 -->
            <div class="search-container">
                <input type="text" id="search-input" placeholder="搜索作品或标签...">
                <button id="search-button">Go!</button>
            </div>

            <!-- 排序和筛选按钮 -->
            <div class="filter-sort-options">
                <div class="sort-options">
                    <button id="sort-date-asc" class="sort-button">
                        <img src="assets/sort-asc-icon.png" alt="Sort by Date (Ascending)" class="icon">
                    </button>
                    <button id="sort-date-desc" class="sort-button">
                        <img src="assets/sort-desc-icon.png" alt="Sort by Date (Descending)" class="icon">
                    </button>
                </div>
                <div class="filter-options">
                    <button id="reset-filter" class="filter-button">
                        <img src="assets/reset-icon.png" alt="Reset Filter" class="icon">
                    </button>
                    <button id="filter-photography" class="filter-button">
                        <img src="assets/filter-photography-icon.png" alt="Photography" class="icon">
                    </button>
                    <button id="filter-design" class="filter-button">
                        <img src="assets/filter-design-icon.png" alt="Design" class="icon">
                    </button>
                    <button id="filter-ideas" class="filter-button">
                        <img src="assets/filter-ideas-icon.png" alt="Ideas" class="icon">
                    </button>
                    <button id="filter-star-icon" class="filter-button">
                        <img src="assets/recommended-icon.png" alt="精选" class="icon">
                    </button>
                </div>
            </div>
        </div>
    </section>

    <section id="portfolio" class="portfolio-section">
        <div class="portfolio-container"> <!-- 新增外层容器 -->
            <div class="portfolio-grid" id="portfolio-grid">
                <!-- 图片卡片将通过 JavaScript 动态加载 -->
            </div>
            <div id="loading-more" style="display: none; text-align: center; padding: 20px;">
                
            </div>
        </div>
    </section>>

    <!-- 底部提示 -->
    <div id="bottom-tip" class="bottom-tip">
        <p>没有更多了</p>
    </div>

    <!-- 浮动语言切换按钮 -->
    <div class="language-switch">
        <button id="languageToggle" class="language-btn">
            <span class="lang-indicator">中</span>
        </button>
    </div>

    <!-- 脚本 -->
    <script type="module" src="scripts/script.js"></script>
</body>
</html>
