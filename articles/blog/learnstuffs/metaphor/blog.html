                    <img src="assets/22.png" alt="长图22" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 15%;" data-note="以上部分讨论了HRI（Human-Robot Interaction）领域长期以来的关于“robot”相关语汇的固有假设困局，设计方法在HRI领域中的应用，以及由此两者结合产生的，由固有假设产生的机器人设计桎梏。" data-image-id="22"></div>
                    <div class="interest-point" style="left: 90%; top: 20%;" data-note="文中将这种假设桎梏归类为三种：1. 机器人需是仿生物且全自动的假设。2. 机器人需围绕实用性、效率、可预见性三准则构建。3. 机器人行为需为积极向的。" data-image-id="22"></div>
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="同时文章亦讨论了设计实践中固化思维（Fixation）产生的原因及其会引致的影响，由此引入在设计领域中破除固化思维流弊的重要工具：隐喻（Metaphor）。" data-image-id="22"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="在介绍了隐喻的语义及其在设计实践中的作用后（破除文字本义局限，影响对问题和产品的思考；为设计决定赋能；发掘复杂概念的不同层次意义），文章提出HRI领域的设计研究应该探索将隐喻作为设想与发展在形式和效用上超越主流拟人、仿生范式的人工社会主体（Robot）" data-image-id="22"></div>
                </div>
                <div class="image-wrapper" data-image-id="23">
                    <img src="assets/23.png" alt="长图23" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 15%;" data-note="本文将HRI领域实践与设计领域的经验结合，描绘并讨论隐喻为机器人设计带来的改变。同时，探索人机互动的其他方式，展现机器人的其他可能（而不是仅仅模仿生物）。重要的是引入并发展了“New Metaphor”方法，构思新的隐喻、新的想象的互动模式、以及超越现有主流观点的机器人形式。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 20%;" data-note="文章组建了一个线上工作坊，募集了28位广领域、兴趣方向的学者。使用“New Metaphor Toolkit”来生成HRI Metaphor。理想地，这个工具通常面对面1对1使用，里面包含150张卡片，75张“事物1”、75张“事物2”，然后任意组合以产生不同的组合。事物1 卡是纯文本的、包含一个形容现象的词。事件2卡包含一张可以与事件1卡联系起来的图片（通常是照片）。New Metaphor 工具先前用于可视化睡眠模式或者其他背景，但没有被应用于HRI领域和用于破除机器人假设。文章将New Metaphor Toolkit放到线上，然后适配以一个随机抽取系统，以保证卡片是随机顺序抽出而不是根据被试喜好抽出的。这样的做法有助于将两个看似无法结合的想法结合起来生成一个新的隐喻。同时作者也将卡片的内容调整了一下，以更符合机器人的实际状况。
                    " data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="那么基于以上提到的工具和方法呢，文章提到他们开展了3个Activity。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="Activity 1 中参与者独自首先用隐喻随机生成器，也就是上面提到的new metaphor toolkit 来尽可能多地生成HRI隐喻。参与者点击随机生成按钮，从中找抽取一张能够激发产出HRI隐喻的卡片组合。如果抽取到的卡片没能够激起灵感，就可以重新抽取，最多连续三次。从这些生成的卡片中，他们抽取其中最具启发作用的卡片，然后藉此生成一个隐喻。以上整个过程重复进行了13分钟，目的是为了引出一些大胆的（Wild）隐喻想法，重视快节奏。最终目标是为了在没什么时间评估判断价值与可行性的情况下，产出大量的HRI隐喻。（文中提到A1他们产出了21个隐喻）" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="Activity 2中参与者将独自用其他被试Pick出的concept产出隐喻，也就是针对同一组卡片产出不同的HRI隐喻。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 40%;" data-note="Activity 3中参与者分组各抽取一个隐喻然后围绕该隐喻创作一个详细的故事板。这个过程中包含头脑风暴和colletive mapping（中文不知对应于什么，这是一种设计方法，大家围在一起将想法写在一面白板或什么东西上，然后将类似想法归类联系起来），做这些的目的就是为了对每一个metaphor有个深入了解以及对其如何应用于HRI领域有一个抽象的想法。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 45%;" data-note="参与者通过讨论他们产出的那个隐喻的特点来表达他们的想法，然后藉此反思他们想要推出的关于机器人的概念。之后，他们创作一个故事板来详细描绘关于这个HRI隐喻在不同的背景，比如教育、家居、辅助、工作环境等背景中，如何应用于现实情况。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="然后他们用故事板评估且详述了82个隐喻，通过这种方式讨论了隐喻的意义，表达对理想生活中人与机器人之间的情境。文章中也提到说他们会就某一隐喻的想法提出疑问，或者用视觉的方式描绘某一个隐喻来去探讨其深层含义。然后用sketches帮助文章的团队更详细、真实、能够想象的到的理想地去理解隐喻背后所蕴含的抽象含义。" data-image-id="23"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="以上产出的隐喻和故事板就是文章作出的第一个重要贡献，表明了人与机器人的新的关系层级是怎么被预想出来的。而下一个重要贡献就是产出一个当下关于机器人的固有假设的一个list，然后用产出来的隐喻作为工具，尝试从这些个固有假设中挣脱。" data-image-id="23"></div>
                </div>
                <div class="image-wrapper" data-image-id="24">
                    <img src="assets/24.png" alt="长图24" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="首先文章就说，目前工作坊内已经产出了许多关于机器众多可能性的广泛猜测和观点，但它不足以重新构建这个设计空间氛围。那么为了将他们产出的这些想法付诸应用，作者他们用亲和图的方式确定想法的特征然后根据他们所要打破的固有假设进行归类。" data-image-id="24"></div>
                </div>
                <div class="image-wrapper" data-image-id="25">
                    <img src="assets/25.png" alt="长图25" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="他们要打破的固有假设主要有三类，一是关于机器人物理特性（physicality）的假设，二是关于机器人所处角色的假设，三是关于机器人交互行为的假设。尽管这些假设并不新颖，而且HRI领域已经有了很多通过不同方式定义机器人的做法来尝试这些假设带来的影响。这篇文章做得工作就是提供一个关于所有这些假设（无论是来自工作坊的产出抑或是其他文献中所提到的假设）的综合列表，来更好地帮助定义问题域。" data-image-id="25"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="下面的部分会先展示某一个要尝试打破的假设，随后开展关于他们认为设计师与研究员可以如何利用这种打破，来重构他们未来工作的一个讨论。比如说，改变机器人设计师现在设计机器人的方式，把那种重复过时的过程变成一种亲和、有趣而且令人愉悦的设计方式，来创造和人交互并且同处于社会环境当中的机器人。" data-image-id="25"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="作者认为了即便是已经存有对这些固有假设挑战的工作，但这些挑战仍然留存于研究者的思维和工作当中（以他们在工作坊中得出的那样）。文章推测是因为先前没有工作明确详细地定义有关机器人的固有假设以及怎么样去颠覆（subvert）这些假设，而这也就是这篇文章所要做的事情。" data-image-id="25"></div>
                </div>
                <div class="image-wrapper" data-image-id="26">
                    <img src="assets/26.png" alt="长图26" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="第一个就是关于机器人物理特性（physicality）的假设，用文中的话解释这个假设就是：机器人的形态是如何设计的，他们的物理特性如何与他们的周边环境联结起来。这个topic下又分了很多种不同的情况。" data-image-id="26"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="比如仿生假设（lifelikeness），就是说人们经常会把robot这个词与一些仿人类或者仿动物的人工形象联系起来。在工作坊当中他们做很多打破这种观点的尝试，像长得像门把手的机器人等等。领域内的一些观点认为机器人不一定是拟人的、或者仿生物的，而是以一切移动有形物为原型的。" data-image-id="26"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="第二个是otherness（不知道怎么翻译）假设。工作坊里面提出的机器人的形式，不一定像通常想象地那样作为一个独立实体出现，而是可以以人体的一部分这样的形式出现。这样的想法就展现了一种在机器人与机械人（human cyborg，比如像星球大战里面的达斯维达）更为灵活的设计设计空间。工作坊内的有些想法还包括说机器人作为身体的一个额外部分，比如说作为第三只手出现的机器人（像蜘蛛侠里面的doctor octopus），或者可以穿的机器人，与人一直连在一起的机器人（像一只鹦鹉一样坐在人身上的），甚至于说像肿瘤一样的机器人" data-image-id="26"></div>
                    <div class="interest-point" style="left: 90%; top: 40%;" data-note="第三个是localness（即地）假设，大多数机器人设计都认为机器人是在“一个”单独位置当中的，但是文章他们认为一个机器人可以同时在很多个地方，比如说作为站点存在的机器人，同时跨越多个不同的空间与时间维度。领域内的一些工作也讨论了关于机器人直接重组以及组合称不同的物理设备或机器来与人交互的情况（Lego或者相机装不同的镜头）" data-image-id="26"></div>
                </div>
                <div class="image-wrapper" data-image-id="27">
                    <img src="assets/27.png" alt="长图27" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="第一部分讨论就这么多，到第二个假设分类，即关于机器人所处角色的假设，一句话解释就是与人交互时的机器人的主要功能和目的是什么，机器人一定要是像机器人设计通常认为的那样，是要有用的吗？" data-image-id="27"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="第一个是效率假设，就是人为机器人通常被想象称一个机器（这句话中文可能有歧义，但是看英文比较容易理解Robots should not be equalled as machine），机器人通常是被当作一种效率工具来设计的。然而机器人是可以扮演一些人们通常不与机器联系起来的角色的。比如说表现家、一个人或者情形状态的机器人，或者一个用于自我表达的衣服。（我理解的这个例子就是说机器人可以服务于一些non-efficent-oriented perposed 而可以作为一种艺术表达主体存在）" data-image-id="27"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="第二个是商品化假设（commodification），就是说人们通常会认为机器人是一件商品，像手机电脑之类的。但他们不这么认为，他们认为机器人可以是一件艺术品，也可以是公共空间的一部分，或者是一件环保机器人。这也与最近呼吁的在塑造复杂技术比如像机器人技术时候采取more-than human center design的观点有关。举例子比如一个守护大自然的机器人。清理环境中的人为垃圾，这样一些思路可以作为一种引导，将设计视野从只让人更舒适投向更为广阔的，地球上的其他主体的方向。" data-image-id="27"></div>
                    <div class="interest-point" style="left: 90%; top: 40%;" data-note="第二个是商品化假设（commodification），就是说人们通常会认为机器人是一件商品，像手机电脑之类的。但他们不这么认为，他们认为机器人可以是一件艺术品，也可以是公共空间的一部分，或者是一件环保机器人。这也与最近呼吁的在塑造复杂技术比如像机器人技术时候采取more-than human center design的观点有关。举例子比如一个守护大自然的机器人。清理环境中的人为垃圾，这样一些思路可以作为一种引导，将设计视野从只让人更舒适投向更为广阔的，地球上的其他主体的方向。" data-image-id="27"></div>
                    <div class="interest-point" style="left: 90%; top: 45%;" data-note="第三个是无瑕疵假设（flawlessness），顾名思义。就是说机器人往往是作为一个他工作内的完美角色出现的，然而工作坊内的许多观点都与这个观点相悖。事实上，很多关于机器人的讨论都是说机器人如何不完美，如何需要协助，甚至于说有些不讨喜的特点。" data-image-id="27"></div>
                </div>
                <div class="image-wrapper" data-image-id="28">
                    <img src="assets/28.png" alt="长图28" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="第三部分的假设是关于机器人交互行为的假设，这部分主要是谈到一些机器人种很常见的固有交互范式问题。" data-image-id="28"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="行为积极假设（positivity），现今我们交互的机器人或者主体都是很有礼貌的、积极的、让人愉悦的。但工作坊中探寻了很多其他的可能，包括比如说机器人是恶意的（ill intentioned）或者说粗鲁的，脾气差的，健忘的等等。这些都是创造不同于我们现在习惯的交互方式的另类人机交互的机会。" data-image-id="28"></div>
                    <div class="interest-point" style="left: 90%; top: 35%;" data-note="行为可预见假设（predictability），大多数与机器人的交互也都是可预见的（或者说至少在朝这个方向努力）。工作坊中有观点认为这不一定是必要的，也可以将随机、即兴甚至于是inconsistent飘忽不定等作为设计中的机器人中心特性
                    " data-image-id="28"></div>
                    <div class="interest-point" style="left: 90%; top: 40%;" data-note="行为独立假设（independence），这个假设认为机器人是独立个体，他们能够自己工作，不需要任何帮助除非是出于人类监管需要。工作坊内有些想法与这个叙述相悖，比如说可以有一系列机器人是以合作方式工作的，或者说些个有依赖性的机器人是需要帮助才能完成任务的，甚至于是一个脆弱的需要照顾的机器人。" data-image-id="28"></div>
                </div>
                <div class="image-wrapper" data-image-id="29">
                    <img src="assets/29.png" alt="长图29" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="行为似人假设（human-likeness），机器人学领域花了很多功夫去完善机器人上的人类自然交互，比如说机器人视觉，自然语言输入输出、触觉等等。非人类交互则在领域内较少探索。工作坊内则尝试用颜色、移动方式和音效作为与机器人交流的其他通道" data-image-id="29"></div>
                </div>
                <div class="image-wrapper" data-image-id="30">
                    <img src="assets/30.png" alt="长图30" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="文章说他们将以上总结的些个假设作为未来机器人设计的突破工具，尽管很多假设已经被克服了，但是新入行的人还是会或多或少陷入关于“robots”的固化叙述当中。文章相信他们呈现的假设以及打破这些假设的观点视角能够帮助设计者和研究员克服工作中的fixation问题。（应用例子略）以及上述的假设列表能够帮助打破使用“robot”一词所连携的强联系和固有叙述，从而能够使整个领域内走向合作，而不是孤立地各自为政，共同将机器人设计领域拓宽到超越我们现今所能了解到的领域。" data-image-id="30"></div>
                </div>
                <div class="image-wrapper" data-image-id="31">
                    <img src="assets/31.png" alt="长图31" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="文章相信设计能够很大程度上回应人们日渐兴起的对未来机器人学的影响和可取性的 反思和研究的需求。这里他引述了Auger的一句话：设计通过鼓励更多关注日常生活的复杂显示、人类习惯、趋势、身份地位象征、美学等等来影响HRI。" data-image-id="31"></div>
                </div>
                <div class="image-wrapper" data-image-id="32">
                    <img src="assets/32.png" alt="长图32" class="long-image">                   
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="藉此文章相信比起在构思机器人的时候使用发散思维等工具，开展这些以打破固有假设为目的的设计探索能够裨益HRI领域。这种设计探索能够帮助人们推测如果联系起现今的社会实践，人们设计的机器人带来什么样的潜在结果。" data-image-id="32"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="通过反直觉联想、para-functional（不知道怎么翻，半功能性，不以实用主义为主？），这些设计探索能够帮助HRI领域发展出一种针对自身实践情况的批判性思维。" data-image-id="32"></div>
                </div>
                <div class="image-wrapper" data-image-id="33">
                    <img src="assets/33.png" alt="长图33" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="通过探索非常规的机器人隐喻，也可以帮助人们深刻对机器人的社会、文化、伦理方面的思考。尽管文章积极激发有关机器人的思考新思路，选择的隐喻、图片以及参与者在工作坊中建立的联系都或多或少根植于特定的世界观与文化、社会观以及实践经验。" data-image-id="33"></div>
                    <div class="interest-point" style="left: 90%; top: 30%;" data-note="即便在探索更多元的解决方法，人以及材料的立场也总是在产出的概念中有所显现。" data-image-id="33"></div>
                </div>
                <div class="image-wrapper" data-image-id="34">
                    <img src="assets/34.png" alt="长图34" class="long-image">
                </div>
                <div class="image-wrapper" data-image-id="35">
                    <img src="assets/35.png" alt="长图35" class="long-image">
                    <div class="interest-point" style="left: 90%; top: 25%;" data-note="这里介绍一下文章未来的设想。文章未来将拓宽打破HRI交互设计领域假设所覆盖的主题。深入了解这些固有假设在设计过程中所带来的或显性或隐性的阻碍，创造更新颖的工作，帮助新老HRI设计师解锁新的设计范式，也将通过掌握机器人的新角色、形制以及与人的新交互方式来激励机器人学家，设计师，艺术家，语言学家以及工程师发展超越现今固有假设的机器人。" data-image-id="35"></div>
                    
                </div>
                
            </div>
        </div>
