<!DOCTYPE html>

<head>

    <title>照片展示 - Cids' Personal Website</title>
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/photo.css"> <!-- 照片展示页特有样式 -->
    <!-- Favicon 配置 -->
    <link rel="icon" type="image/png" href="../../../assets/favicon.png">
    <link rel="apple-touch-icon" href="../../../assets/favicon.png">
    <link rel="manifest" href="../../../assets/site.webmanifest">

<body class="photo-page">
    <!-- 照片展示部分 -->
    <section class="photo-container">

        <header>
          <nav id="navbar" class="top-navbar">
              <div class="nav-links">

          </nav>

            <!-- More 和图标 -->
            <div class="more-frontpage">

        <button id="back-button" class="back-button">
            <img src="../../../assets/back-icon.png" alt="返回" class="back-icon">
            返回
        </button>

    <!-- 脚本 -->
    <script type="module" src="../../../scripts/script.js"></script>
    <script>
        // 禁用右键菜单和复制功能
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('copy', (e) => e.preventDefault());
    </script>
