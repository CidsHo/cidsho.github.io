<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与“生”对谈 - Birdie</title>
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/scroll.css">
    
    <!-- Favicon 配置 -->
    <link rel="icon" type="image/png" href="../../../assets/favicon.png">
    <link rel="apple-touch-icon" href="../../../assets/favicon.png">
    <link rel="manifest" href="../../../assets/site.webmanifest">
    <meta name="msapplication-TileImage" content="assets/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
</head>
<body>
    
    <!-- 滚动区域 -->
    <div class="scroll-area">
        <div class="container">
            <div class="multi-image-container">
                <div class="image-wrapper" data-image-id="1">
                    <img src="assets/1.PNG" alt="长图1" class="long-image">
                </div>
                <div class="image-wrapper" data-image-id="2">
                    <img src="assets/2.PNG" alt="长图2" class="long-image">
                </div>
                <div class="image-wrapper" data-image-id="3">
                    <img src="assets/3.PNG" alt="长图3" class="long-image">
                </div>                
                <div class="image-wrapper" data-image-id="4">
                    <img src="assets/4.PNG" alt="长图4" class="long-image">
                </div>                
                <div class="image-wrapper" data-image-id="5">
                    <img src="assets/5.PNG" alt="长图5" class="long-image">
                </div>                          

            </div>
        </div>
        
        <!-- 信息面板容器(在容器外部) - 只需一个 -->
        <div class="info-container">
            <div class="info-panel">
                <h2 class="photo-title">与“生”对谈 - Birdie </h2>
                <div class="author-info">
                    <span class="tag">2022年06月18日</span>
                </div>
                
                <div class="description-container">
                    <p class="photo-description"><strong>与“生”对谈 - Birdie, 仿生沟通交互媒体艺术装置设计 </strong></p>
                    <p class="photo-description">新媒体艺术创作课堂作业，项目受到新冠肺炎疫情影响最终没有落地，仅供参考</p>
                </div>
                
                <!-- 标签在文字介绍下方 -->
                <div class="photo-tags">
                    <span class="tag">设计企划</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-handle"></div>
        <button class="toolbar-btn" id="toggle-points" title="显示/隐藏兴趣点">
            <img src="../../../assets/tag.png" alt="兴趣点">
        </button>
        <button class="toolbar-btn" id="toggle-fullscreen" title="全屏">
            <img src="../../../assets/full-screen.png" alt="全屏">
        </button>
        <button class="toolbar-btn" id="jump-to-start" title="回到顶部">
            <img src="../../../assets/jump-to-start.png" alt="回到顶部">
        </button>
        <button class="toolbar-btn" id="jump-to-end" title="跳转到末尾">
            <img src="../../../assets/jump-to-end.png" alt="跳转到末尾">
        </button>
        <button class="toolbar-btn" id="go-back" title="返回上一页">
            <img src="../../../assets/back-icon.png" alt="返回">
        </button>
    </div>

    <!-- 浮窗 -->
    <div class="note-popup">
        <div class="note-content"></div>
        <button class="close-btn">×</button>
    </div>

    <script src="../../../scripts/script.js"></script>
    <script src="../../../scripts/scroll.js"></script>
</body>
</html>
