<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siggraph Asia 2024 Booklet</title>
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/scroll.css">
    
    <!-- Favicon 配置 -->
    <link rel="icon" type="image/png" href="../../../assets/favicon.png">
    <link rel="apple-touch-icon" href="../../../assets/favicon.png">
    <link rel="manifest" href="../../../assets/site.webmanifest">
    <meta name="msapplication-TileImage" content="assets/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
</head>
<body>
    
    <!-- 滚动区域 -->
    <div class="scroll-area">
        <div class="container">
            <div class="multi-image-container">
                <div class="image-wrapper" data-image-id="1">
                    <img src="assets/Screen01.png" alt="长图1" class="long-image">
                </div>
                <div class="image-wrapper" data-image-id="2">
                    <img src="assets/Screen02.png" alt="长图2" class="long-image">
                </div>
                <div class="image-wrapper" data-image-id="3">
                    <img src="assets/Screen03.png" alt="长图3" class="long-image">
                </div>                
                <div class="image-wrapper" data-image-id="4">
                    <img src="assets/Screen04.png" alt="长图4" class="long-image">
                </div>                
                <div class="image-wrapper" data-image-id="5">
                    <img src="assets/Screen05.png" alt="长图5" class="long-image">
                </div>                          

            </div>
        </div>
        
        <!-- 信息面板容器(在容器外部) - 只需一个 -->
        <div class="info-container">
            <div class="info-panel">
                <h2 class="photo-title">Siggraph Asia 2024 展示册 </h2>
                <div class="author-info">
                    <span class="tag">2024年12月03日</span>
                </div>
                
                <div class="description-container">
                    <p class="photo-description"><strong>为了Siggraph Asia 2024做的一套小册子，挑了几个重要的Section作为内容。文章主要研究的内容集中在Research部分，仅供参考</strong></p>
                    <p class="photo-description">另见：<a href="https://www.shadowplayvr.com/spVR-Booklet-legacy/test.html">文章介绍</a></p>
                </div>
                
                <!-- 标签在文字介绍下方 -->
                <div class="photo-tags">
                    <span class="tag">版式设计</span>
                    <span class="tag">用户体验研究</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-handle"></div>
        <button class="toolbar-btn" id="toggle-points" title="显示/隐藏兴趣点">
            <img src="../../../assets/tag.png" alt="兴趣点">
        </button>
        <button class="toolbar-btn" id="toggle-fullscreen" title="全屏">
            <img src="../../../assets/full-screen.png" alt="全屏">
        </button>
        <button class="toolbar-btn" id="jump-to-start" title="回到顶部">
            <img src="../../../assets/jump-to-start.png" alt="回到顶部">
        </button>
        <button class="toolbar-btn" id="jump-to-end" title="跳转到末尾">
            <img src="../../../assets/jump-to-end.png" alt="跳转到末尾">
        </button>
        <button class="toolbar-btn" id="go-back" title="返回上一页">
            <img src="../../../assets/back-icon.png" alt="返回">
        </button>
    </div>

    <!-- 浮窗 -->
    <div class="note-popup">
        <div class="note-content"></div>
        <button class="close-btn">×</button>
    </div>

    <script src="../../../scripts/script.js"></script>
    <script src="../../../scripts/scroll.js"></script>
</body>
</html>
