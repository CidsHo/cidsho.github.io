<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>长图展示页面</title>
    <link rel="stylesheet" href="../../../styles/components.css">
    <link rel="stylesheet" href="../../../styles/scroll.css">
    
    <!-- Favicon 配置 -->
    <link rel="icon" type="image/png" href="../../../assets/favicon.png">
    <link rel="apple-touch-icon" href="../../../assets/favicon.png">
    <link rel="manifest" href="../../../assets/site.webmanifest">
    <meta name="msapplication-TileImage" content="assets/favicon.png">
    <meta name="msapplication-TileColor" content="#ffffff">
</head>
<body>
    <!-- 滚动区域 -->
    <div class="scroll-area">
        <!-- 图片容器 - 改为支持多图 -->
        <div class="container">
            <div class="multi-image-container">
                <!-- 图片1 -->
                <div class="image-wrapper" data-image-id="1">
                    <img src="demo.jpg" alt="长图1" class="long-image">
                    <!-- 兴趣点 - 现在需要指定所属图片 -->
                    <div class="interest-point" style="left: 20%; top: 30%;" data-note="这是第一张图的兴趣点1" data-image-id="1"></div>
                    <div class="interest-point" style="left: 50%; top: 60%;" data-note="这是第一张图的兴趣点2" data-image-id="1"></div>
                </div>
                
                <!-- 图片2 -->
                <div class="image-wrapper" data-image-id="2">
                    <img src="demo.jpg" alt="长图2" class="long-image">
                    <!-- 第二张图的兴趣点 -->
                    <div class="interest-point" style="left: 30%; top: 40%;" data-note="这是第二张图的兴趣点" data-image-id="2"></div>
                </div>
                
                <!-- 可以继续添加更多图片 -->
                <!-- 图片3 
                <div class="image-wrapper" data-image-id="3">
                    <img src="demo3.jpg" alt="长图3" class="long-image">
                    <div class="interest-point" style="left: 40%; top: 45%;" data-note="这是第三张图的兴趣点" data-image-id="3"></div>
                </div>
                -->
            </div>
        </div>
        
        <!-- 信息面板容器(在容器外部) - 只需一个 -->
        <div class="info-container">
            <div class="info-panel">
                <h2 class="photo-title">多图卷轴系列</h2>
                
                <div class="author-info">
                    <span class="tag">作者: 张三</span>
                    <span class="tag">2023年10月</span>
                </div>
                
                <div class="description-container">
                    <p class="photo-description">这是一个多图卷轴展示。这里可以放更多关于这组图片的详细介绍。</p>
                    <p class="photo-description">可以描述创作背景、灵感来源、创作过程等内容。这部分可以垂直滚动查看更多内容。</p>
                    <p class="photo-description">这里是更多的描述文字，足够长以测试垂直滚动功能。</p>
                    <p class="photo-description">这里是更多的描述文字，足够长以测试垂直滚动功能。</p>
                </div>
                
                <!-- 标签在文字介绍下方 -->
                <div class="photo-tags">
                    <span class="tag">风景</span>
                    <span class="tag">长图</span>
                    <span class="tag">艺术</span>
                    <span class="tag">系列</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 工具栏 -->
    <div class="toolbar" id="toolbar">
        <div class="toolbar-handle"></div>
        <button class="toolbar-btn" id="toggle-points" title="显示/隐藏兴趣点">
            <img src="../../../assets/tag.png" alt="兴趣点">
        </button>
        <button class="toolbar-btn" id="toggle-fullscreen" title="全屏">
            <img src="../../../assets/full-screen.png" alt="全屏">
        </button>
        <button class="toolbar-btn" id="jump-to-start" title="回到顶部">
            <img src="../../../assets/jump-to-start.png" alt="回到顶部">
        </button>
        <button class="toolbar-btn" id="jump-to-end" title="跳转到末尾">
            <img src="../../../assets/jump-to-end.png" alt="跳转到末尾">
        </button>
        <button class="toolbar-btn" id="go-back" title="返回上一页">
            <img src="../../../assets/back-icon.png" alt="返回">
        </button>
    </div>

    <!-- 浮窗 -->
    <div class="note-popup">
        <div class="note-content"></div>
        <button class="close-btn">×</button>
    </div>

    <script src="../../../scripts/script.js"></script>
    <script src="../../../scripts/scroll.js"></script>
</body>
</html>
